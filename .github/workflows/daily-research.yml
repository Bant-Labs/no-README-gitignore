name: Daily prospecting research (Mode A — cloud, no LinkedIn access)

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  research-and-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Mode A (research + draft, no send)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --headless \
            --prompt "Run Mode A from CLAUDE.md: process today's pending companies, find POCs, draft outreach notes, write the batch CSV. Do not send anything." \
            --allowedTools "web_search,web_fetch" \
            --output-dir data/

      - name: Commit today's batch + updated pipeline
        run: |
          git config user.name "bant-labs-outreach-bot"
          git config user.email "actions@github.com"
          git add data/daily-batch-*.csv data/pipeline.md
          git diff --cached --quiet || git commit -m "Daily batch: $(date +%F)"
          git push

# Setup notes:
# 1. Add ANTHROPIC_API_KEY as a repo secret (Settings > Secrets and variables > Actions)
# 2. This workflow NEVER touches LinkedIn or sends the digest email — it only
#    prepares data/daily-batch-<date>.csv for manual review, and updates pipeline.md.
# 3. Review the batch (CSV, opens in Excel/Sheets), mark Approved = yes on rows you want sent.
# 4. Actual sending + the LinkedIn activity check happen locally via Claude in
#    Chrome (Mode B) — run those from your machine when convenient, not on a schedule.
